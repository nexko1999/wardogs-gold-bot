name: Daily Wardogs Gold Price Webhook

on:
  schedule:
    # UTC 00:00 = 한국 시간(KST) 매일 오전 9시 00분 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 'Run workflow' 버튼으로 수동 즉시 테스트 가능

jobs:
  send-gold-price:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치 (Cloudflare 우회 및 HTML 파싱)
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4

      - name: 워독스 금괴 시세 수집 및 디스코드 웹후크 전송 실행
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
