name: Daily Wardogs Gold Price Webhook

on:
  schedule:
    # UTC 01:07 = 한국 시간(KST) 매일 오전 10시 07분 자동 실행 (정각 병목 우회)
    - cron: '7 1 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 'Run workflow' 버튼으로 수동 즉시 테스트 가능

permissions:
  contents: read

concurrency:
  group: daily-gold-price
  cancel-in-progress: false

jobs:
  send-gold-price:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v7

    - name: Python 3.11 설치
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip

    - name: 필요한 라이브러리 설치 (Cloudflare 우회 및 HTML 파싱)
      run: pip install -r requirements.txt

    - name: 워독스 금괴 시세 수집 및 디스코드 웹후크 전송 실행
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python main.py

  # 60일 비활성화 방지용 best-effort 조치.
  # enable API 호출이 60일 비활성화 타이머를 늦춘다는 것은 공식 문서로 보장되지 않는다.
  # actions: write 권한을 이 job 에만 부여해 최소 권한을 유지하며,
  # 단계가 실패해도(continue-on-error) 워크플로 결과는 본 job 결과만 따른다.
  keepalive:
    needs: send-gold-price
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
    - name: 예약 워크플로 비활성화 방지(keepalive, best-effort)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/daily.yml/enable
