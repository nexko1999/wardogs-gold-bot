name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 ref 에서 새 실행이 시작되면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v4

    - name: Python 3.11 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip

    - name: 필요한 라이브러리 설치
      run: pip install -r requirements.txt

    - name: 단위 테스트 실행
      run: python -m unittest discover -s tests -v
